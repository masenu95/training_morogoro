spring.application.name=order-service
server.port=8089

spring.datasource.url=jdbc:mysql://localhost:3306/order_db?createDatabaseIfNotExist=true
spring.datasource.username=db_user
spring.datasource.password=P@$$w0rd

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


eureka.instance.hostname= localhost
eureka.client.register-with-eureka= true 
eureka.client.fetch-registry= true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

management.endpoints.web.exposure.include=*
management.endpoints.web.base-path=/just-me

# If 50% of the last 10 requests fail, open the circuit
resilience4j.circuitbreaker.instances.orderService.sliding-window-size=10
resilience4j.circuitbreaker.instances.orderService.failure-rate-threshold=50

# Wait 10 seconds in OPEN state before trying to route traffic again (HALF-OPEN)
resilience4j.circuitbreaker.instances.orderService.wait-duration-in-open-state=10000


# Total number of attempts (1 original call + 2 retries)
resilience4j.retry.instances.orderRetry.max-attempts=3
# Wait 2 seconds (2000 ms) before trying again
resilience4j.retry.instances.orderRetry.wait-duration=10000



# ==========================================
# ⏱️ RATE LIMITER CONFIGURATION
# ==========================================
# The period of time for a single limit refresh cycle
resilience4j.ratelimiter.instances.orderRateLimiter.limit-refresh-period=1s
# Maximum number of allowed permissions during a single period window
resilience4j.ratelimiter.instances.orderRateLimiter.limit-for-period=5
# How long a thread will wait for an available permission block before failing fast
resilience4j.ratelimiter.instances.orderRateLimiter.timeout-duration=0ms

# ==========================================
# 🛡️ BULKHEAD CONFIGURATION (SEMAPHORE STYLE)
# ==========================================
# Capped number of concurrent operational threads allowed into this block simultaneously
resilience4j.bulkhead.instances.orderBulkhead.max-concurrent-calls=3
# Max time a thread is allowed to block waiting for an entry seat in the bulkhead pool
resilience4j.bulkhead.instances.orderBulkhead.max-wait-duration=20ms

# Maximum time allowed for the remote operation to complete
resilience4j.timelimiter.instances.orderTimeLimiter.timeout-duration=2s

# Should the running thread be cancelled/interrupted if a timeout occurs?
resilience4j.timelimiter.instances.orderTimeLimiter.cancel-running-future=true
