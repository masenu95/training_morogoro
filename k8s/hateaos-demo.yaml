apiVersion: apps/v1
kind: Deployment
metadata:
  name: hateaos-demo
  labels:
    app: hateaos-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hateaos-demo
  template:
    metadata:
      labels:
        app: hateaos-demo
    spec:
      containers:
        - name: hateaos-demo
          image: spring-app-hateaos-demo:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8077
---
apiVersion: v1
kind: Service
metadata:
  name: hateaos-demo
spec:
  type: NodePort
  selector:
    app: hateaos-demo
  ports:
    - port: 8077
      targetPort: 8077
      nodePort: 30077
