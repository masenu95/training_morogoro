server.port=8089

spring.datasource.url=jdbc:mysql://localhost:3306/order_db?createDatabaseIfNotExist=true

management.endpoints.web.base-path=/just-me

spring.cloud.openfeign.micrometer.enabled=true

resilience4j.circuitbreaker.circuit-breaker-aspect-order=101
resilience4j.circuitbreaker.instances.orderService.sliding-window-size=10
resilience4j.circuitbreaker.instances.orderService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.orderService.wait-duration-in-open-state=10000
resilience4j.circuitbreaker.instances.orderService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.orderService.ignore-exceptions=io.github.resilience4j.ratelimiter.RequestNotPermitted,io.github.resilience4j.bulkhead.BulkheadFullException

resilience4j.retry.instances.orderRetry.max-attempts=3
resilience4j.retry.instances.orderRetry.wait-duration=10000

resilience4j.ratelimiter.instances.orderRateLimiter.limit-refresh-period=30s
resilience4j.ratelimiter.instances.orderRateLimiter.limit-for-period=5
resilience4j.ratelimiter.instances.orderRateLimiter.timeout-duration=0ms

resilience4j.bulkhead.instances.orderBulkhead.max-concurrent-calls=3
resilience4j.bulkhead.instances.orderBulkhead.max-wait-duration=20ms

spring.cloud.openfeign.circuitbreaker.enabled=true
resilience4j.timelimiter.configs.default.timeout-duration=3s
resilience4j.timelimiter.configs.default.cancel-running-future=true

spring.cloud.function.definition=receiveOrders;productEvents;inventoryEvents
spring.cloud.stream.bindings.sendOrder-out-0.destination=createOrders
spring.cloud.stream.bindings.receiveOrders-in-0.destination=createOrders
spring.cloud.stream.bindings.receiveOrders-in-0.group=createOrder-group
spring.cloud.stream.bindings.productEvents-in-0.destination=product-events
spring.cloud.stream.bindings.productEvents-in-0.group=order-service
spring.cloud.stream.bindings.inventoryEvents-in-0.destination=inventory-events
spring.cloud.stream.bindings.inventoryEvents-in-0.group=order-service
spring.cloud.stream.bindings.orderEvents-out-0.destination=order-events
spring.cloud.stream.bindings.orderEvents-out-0.producer.required-groups=inventory-service
