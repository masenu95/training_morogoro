spring.datasource.password=P@$$w0rd

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


eureka.instance.hostname= localhost
eureka.client.register-with-eureka= true 
eureka.client.fetch-registry= true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

management.endpoints.web.exposure.include=*
management.endpoints.web.base-path=/abc
management.tracing.sampling.probability= 1.0


resilience4j.ratelimiter.configs.default.subscribe-for-events=true
resilience4j.ratelimiter.configs.default.event-consumer-buffer-size=50
resilience4j.ratelimiter.instances.productRateLimiter.base-config=default

# Allow a maximum of 3 calls
resilience4j.ratelimiter.instances.productRateLimiter.limit-for-period=3
  # The refresh period window (10 seconds)
resilience4j.ratelimiter.instances.productRateLimiter.limit-refresh-period=1s
# If a request gets blocked, how long should it wait in line before failing immediately (0 means fail instantly)
resilience4j.ratelimiter.instances.productRateLimiter.timeout-duration=0ms
# Enable an event consumer buffer size of 10 events i.e. history
resilience4j.ratelimiter.instances.productRateLimiter.subscribe-for-events=true
resilience4j.ratelimiter.instances.productRateLimiter.event-consumer-buffer-size=30